# Code generation for the Go client and server stubs.
#
# Buf runs the generators as local commands through `go tool`; the versions are
# pinned by the tool directives in go.mod:
#   protoc-gen-go      v1.36.12
#   protoc-gen-go-grpc v1.6.2
# Generation therefore needs no network. Bump a version in go.mod and regenerate
# in the same commit so the committed output always matches the fixed generator.
version: v2

plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: api
    opt:
      - paths=source_relative
  - local: ["go", "tool", "protoc-gen-go-grpc"]
    out: api
    opt:
      - paths=source_relative
