name: castworks-dev

services:
  postgres:
    # PostgreSQL 18 is the current stable major; pin the exact patch release.
    image: postgres:18.7
    environment:
      POSTGRES_USER: castworks
      POSTGRES_PASSWORD: castworks
      POSTGRES_DB: castworks_test
      # The 18 image moved the default data directory. Pin PGDATA so the
      # named volume below is the one the server initializes and uses.
      PGDATA: /var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U castworks -d castworks_test"]
      interval: 2s
      timeout: 5s
      retries: 30

  postgres-test:
    # Tests use a separate server so creating and dropping one database per
    # test does not touch the persistent data on the mechanical disk. The
    # image, credentials and database name match postgres, so the same
    # connection-string template works with only the port changed.
    image: postgres:18.7
    environment:
      POSTGRES_USER: castworks
      POSTGRES_PASSWORD: castworks
      POSTGRES_DB: castworks_test
      PGDATA: /var/lib/postgresql/data
    ports:
      - "127.0.0.1:55433:5432"
    # The data directory lives in RAM and is discarded with the container.
    tmpfs:
      - /var/lib/postgresql/data
    # Dropping a database forces a checkpoint. These settings keep that
    # checkpoint cheap: a test database is disposable, so losing the last
    # transactions on a crash is acceptable.
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - full_page_writes=off
      - -c
      - synchronous_commit=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U castworks -d castworks_test"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
