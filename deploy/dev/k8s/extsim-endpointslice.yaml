# The development host's address behind the selectorless Service extsim.
# 10.12.72.11 is the host's own IP; port 9100 is extsim's job interface.
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: extsim
  namespace: castworks-system
  labels:
    kubernetes.io/service-name: extsim
    endpointslice.kubernetes.io/managed-by: castworks-dev-setup
    app.kubernetes.io/part-of: castworks
addressType: IPv4
ports:
- name: jobs
  port: 9100
  protocol: TCP
endpoints:
- addresses:
  - 10.12.72.11
  conditions:
    ready: true
    serving: true
    terminating: false
