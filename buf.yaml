version: v2

modules:
  # pkg/ is the module root so the proto keeps its module-relative path,
  # agentprotocol/v1/agentprotocol.proto. The wire name (agentprotocol.v1) and
  # the RPC full names therefore stay unchanged.
  - path: pkg

lint:
  use:
    - STANDARD
  except:
    # The design fixes the service name as AgentStream; it is not a *Service.
    - SERVICE_SUFFIX
    # The stream types are fixed as WardenFrame and ControlFrame, not
    # ConnectRequest and ConnectResponse.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
