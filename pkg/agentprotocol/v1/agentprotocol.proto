// Protocol between the warden process and the control plane.
//
// A warden opens one bidirectional gRPC stream and exchanges frames with the
// control plane. The message set is the subset of the design's closed message
// set that v0.1.0 implements; names match the design.
syntax = "proto3";

package agentprotocol.v1;

option go_package = "github.com/wangzw/castworks/pkg/agentprotocol/v1;agentprotocolv1";

// AgentStream is the only service on the warden connection.
service AgentStream {
  rpc Connect(stream WardenFrame) returns (stream ControlFrame);
}

// WardenFrame is a message sent by the warden to the control plane.
message WardenFrame {
  string run_id = 1;

  oneof body {
    Hello hello = 2;
    AgentEvent event = 3;
    Accepted accepted = 4;
  }
}

// ControlFrame is a message sent by the control plane to the warden.
message ControlFrame {
  string run_id = 1;

  oneof body {
    HelloAck hello_ack = 2;
    Deliver deliver = 3;
    Shutdown shutdown = 4;
  }
}

// Hello is the first frame of every stream.
message Hello {
  AgentState agent_state = 1;
  // last_accepted_seq is the largest inbox_seq the warden has written to
  // Claude Code; it is 0 before anything was written.
  int64 last_accepted_seq = 2;
  // last_turn carries the latest turn result when phase is PHASE_BOUNDARY.
  LastTurn last_turn = 3;
}

// Phase is the warden's view of the agent at the time the stream opened.
enum Phase {
  PHASE_UNSPECIFIED = 0;
  PHASE_STARTING = 1;
  PHASE_IN_TURN = 2;
  PHASE_BOUNDARY = 3;
  PHASE_EXITED = 4;
}

// AgentState describes the agent state reported in Hello.
message AgentState {
  Phase phase = 1;
  string turn_id = 2;
}

// LastTurn is the result of the most recent turn.
message LastTurn {
  string turn_id = 1;
  string output = 2;
  bool is_error = 3;
}

// AgentEvent reports the start or the end of a turn.
message AgentEvent {
  // turn_id is generated by the warden and is unique within one run.
  string turn_id = 1;

  oneof kind {
    TurnStarted turn_started = 2;
    TurnEnded turn_ended = 3;
  }
}

// TurnStarted reports that a turn began.
message TurnStarted {
  // delivery_id is empty for a turn the agent started on its own.
  string delivery_id = 1;
  string session_id = 2;
}

// TurnEnded reports that a turn ended.
message TurnEnded {
  // output is the turn's result text, truncated past 1 MiB.
  string output = 1;
  bool is_error = 2;
  bool agent_exited = 3;
}

// Accepted acknowledges that a delivery batch was written to stdin.
message Accepted {
  string delivery_id = 1;
  int64 through_seq = 2;
}

// HelloAck accepts the stream.
message HelloAck {
  LLMCredential llm_credential = 1;
}

// LLMCredentialKind selects how the credential value is interpreted.
enum LLMCredentialKind {
  LLM_CREDENTIAL_KIND_UNSPECIFIED = 0;
  LLM_CREDENTIAL_KIND_API_KEY = 1;
  LLM_CREDENTIAL_KIND_OAUTH_TOKEN = 2;
}

// LLMCredential is the credential the warden passes to Claude Code.
message LLMCredential {
  LLMCredentialKind kind = 1;
  string value = 2;
}

// Deliver hands a batch of human messages to the warden.
message Deliver {
  string delivery_id = 1;
  // batch is ordered by strictly increasing inbox_seq.
  repeated InboxMessage batch = 2;
  // through_seq is the inbox_seq of the last message in batch.
  int64 through_seq = 3;
}

// InboxMessage is one human message in a delivery batch.
message InboxMessage {
  int64 inbox_seq = 1;
  string text = 2;
}

// Shutdown tells the warden that the run has ended.
message Shutdown {
  string reason = 1;
}
